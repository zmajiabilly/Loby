name: Build Windows editor-toolbar installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out tested editor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d8645a37ad897c52d5393285eaec753aa4884579
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Rust target
        shell: bash
        run: rustup target add x86_64-pc-windows-msvc

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps

      - name: Build NSIS installer without updater artifact
        shell: bash
        run: npm run build -- --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows.conf.json --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify installer and write checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $stream = [System.IO.File]::OpenRead($installer.FullName)
          try {
            if ($stream.ReadByte() -ne 77 -or $stream.ReadByte() -ne 90) { throw "Installer has no MZ header" }
          } finally { $stream.Dispose() }
          New-Item -ItemType Directory -Force -Path windows-output | Out-Null
          $target = "windows-output/Loby_0.6.0_editor-toolbar_x64-setup.exe"
          Copy-Item $installer.FullName $target
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Loby_0.6.0_editor-toolbar_x64-setup.exe" | Set-Content windows-output/SHA256SUMS.txt
          "source=d8645a37ad897c52d5393285eaec753aa4884579" | Set-Content windows-output/BUILD.txt
          Write-Host "Installer: $target"
          Write-Host "SHA256: $hash"

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Loby-0.6.0-editor-toolbar-Windows-x64
          path: windows-output/
          if-no-files-found: error
          retention-days: 7
